name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: surveys
          POSTGRES_PASSWORD: surveys
          POSTGRES_DB: surveys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surveys -d surveys_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

      - name: Tests (SQLite)
        run: pytest -q

      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://surveys:surveys@localhost:5432/surveys_test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t survey-builder:ci .
