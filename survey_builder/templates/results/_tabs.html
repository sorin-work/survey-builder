<nav class="tabs">
  <a href="{{ url_for('results.summary', survey_id=survey.id) }}"
     {% if active == "summary" %}class="active"{% endif %}>Summary</a>
  <a href="{{ url_for('results.responses', survey_id=survey.id) }}"
     {% if active == "responses" %}class="active"{% endif %}>Responses</a>
  <button class="link tabs-action" type="button" onclick="window.print()">Print</button>
  <a href="{{ url_for('results.export_csv', survey_id=survey.id, **(period.as_args() if period is defined else {})) }}">Download CSV</a>
</nav>
