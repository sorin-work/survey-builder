<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ survey.title }}{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% if survey.accent_color %}
      <style>:root { --accent: {{ survey.accent_color }}; --accent-dark: {{ survey.accent_color }}; }</style>
    {% endif %}
  </head>
  <body class="public{% if g.embed %} embedded{% endif %}">
    <main class="container narrow-public">
      {% block content %}{% endblock %}
    </main>
    {% if not g.embed %}<footer class="public-footer muted">Made with Survey Builder</footer>{% endif %}
    <script src="{{ url_for('static', filename='js/public.js') }}" defer></script>
  </body>
</html>
