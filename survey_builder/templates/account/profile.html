{% extends "base.html" %}
{% block title %}Your account · Survey Builder{% endblock %}
{% block content %}
  <section class="card narrow">
    <h1>Your account</h1>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ form.name }}" autocomplete="name">
        {% if errors.name %}<div class="field-error">{{ errors.name }}</div>{% endif %}
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ form.email }}" autocomplete="email">
        {% if errors.email %}<div class="field-error">{{ errors.email }}</div>{% endif %}
      </div>
      <button class="btn" type="submit">Save</button>
    </form>
    <p><a href="{{ url_for('account.password') }}">Change your password</a></p>
  </section>
{% endblock %}
