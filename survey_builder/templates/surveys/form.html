{% extends "base.html" %}
{% block title %}New survey · Survey Builder{% endblock %}
{% block content %}
  <section class="card">
    <h1>New survey</h1>
    <form method="post" novalidate>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ form.title }}" maxlength="200" required>
        {% if errors.title %}<div class="field-error">{{ errors.title }}</div>{% endif %}
      </div>
      <div class="field">
        <label for="description">Description <span class="muted">(optional)</span></label>
        <textarea id="description" name="description" rows="3">{{ form.description }}</textarea>
      </div>
      <button class="btn" type="submit">Create survey</button>
      <a class="btn btn-secondary" href="{{ url_for('surveys.dashboard') }}">Cancel</a>
    </form>
  </section>
{% endblock %}
